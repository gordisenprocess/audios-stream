<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Audio al Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e1e1e; padding: 30px; border-radius: 15px; text-align: center; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    input { width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: none; background: #2c2c2c; color: white; font-size: 16px; text-align: center; }
    button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    #btnGrabar { background: #9146FF; color: white; }
    #btnGrabar.grabando { background: #ff3b3b; animation: pulse 1s infinite; }
    #estado { margin-top: 15px; font-size: 14px; color: #ffcc00; word-break: break-all; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="card">
  <h2>🎙️ Manda tu audio</h2>
  <input type="text" id="usuario" placeholder="Tu nombre" maxlength="20">
  <button id="btnGrabar">🎙️ Tocar para Grabar</button>
  <p id="estado">Listo para grabar (máx 10s)</p>
</div>

<script>
  // --- TUS CREDENCIALES DE SUPABASE ---
  const SUPABASE_URL = 'https://imgykwbppdxynbaznhlg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_n9sInXCIbT5clU4pNKfHtg_EvF29TCb';
  // -----------------------------------

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  const btnGrabar = document.getElementById('btnGrabar');
  const estado = document.getElementById('estado');
  const inputUsuario = document.getElementById('usuario');

  let mediaRecorder;
  let audioChunks = [];
  let grabando = false;
  let timeoutGrabacion;

  btnGrabar.addEventListener('click', async () => {
    if (!grabando) {
      await iniciarGrabacion();
    } else {
      detenerGrabacion();
    }
  });

  async function iniciarGrabacion() {
    estado.textContent = 'Solicitando permiso de micrófono...';
    
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Tu navegador no soporta grabación de audio.");
      }

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      
      // Buscar un tipo de soporte compatible y universal para evitar errores de códec
      let opciones = { mimeType: 'audio/webm' };
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
        opciones = { mimeType: 'audio/webm;codecs=opus' };
      } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
        opciones = { mimeType: 'audio/mp4' };
      }

      mediaRecorder = new MediaRecorder(stream, opciones);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = enviarAudio;

      mediaRecorder.start();
      grabando = true;
      btnGrabar.textContent = '⏹️ Detener y Enviar';
      btnGrabar.classList.add('grabando');
      estado.textContent = '🔴 Grabando... Habla ahora';

      timeoutGrabacion = setTimeout(() => {
        if (grabando) detenerGrabacion();
      }, 10000);

    } catch (err) {
      console.error(err);
      estado.textContent = '⚠️ Error: ' + err.message;
      btnGrabar.disabled = false;
    }
  }

  function detenerGrabacion() {
    clearTimeout(timeoutGrabacion);
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(track => track.stop());
    }
    grabando = false;
    btnGrabar.textContent = '⏳ Subiendo audio...';
    btnGrabar.classList.remove('grabando');
    btnGrabar.disabled = true;
    estado.textContent = 'Enviando al servidor...';
  }

  async function enviarAudio() {
    try {
      // Usar el tipo MIME con el que grabó el navegador
      const mimeUsado = mediaRecorder.mimeType || 'audio/webm';
      const audioBlob = new Blob(audioChunks, { type: mimeUsado });
      
      // Extension automatica según el tipo
      const extension = mimeUsado.includes('mp4') ? 'm4a' : 'webm';
      const nombreArchivo = `audio_${Date.now()}.${extension}`;
      const nombreUsuario = inputUsuario.value.trim() || 'Anónimo';

      // 1. Subir a Storage
      const { data: uploadData, error: uploadError } = await db.storage
        .from('audios')
        .upload(nombreArchivo, audioBlob);

      if (uploadError) throw new Error("Storage: " + uploadError.message);

      // 2. Obtener URL
      const { data: urlData } = db.storage
        .from('audios')
        .getPublicUrl(nombreArchivo);

      // 3. Guardar en Base de Datos
      const { error: dbError } = await db
        .from('mensajes')
        .insert([{ usuario: nombreUsuario, audio_url: urlData.publicUrl }]);

      if (dbError) throw new Error("Base de datos: " + dbError.message);

      estado.textContent = '✅ ¡Audio enviado con éxito!';
    } catch (err) {
      console.error(err);
      estado.textContent = '⚠️ Error: ' + err.message;
    } finally {
      btnGrabar.disabled = false;
      btnGrabar.textContent = '🎙️ Grabar otro audio';
    }
  }
</script>
</body>
</html>
