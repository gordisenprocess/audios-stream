<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUDIO-CAST // Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@500;700&display=swap');

    :root {
      --bg-color: #0f0e17;
      --card-bg: #191825;
      --primary: #ff007f;
      --secondary: #00f0ff;
      --text: #fffffe;
      --border: #7f5af0;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* Indicador de versión flotante para control de caché con F5 */
    #tagVersion {
      position: absolute;
      top: 15px;
      right: 20px;
      background: var(--primary);
      color: white;
      font-family: 'VT323', monospace;
      font-size: 22px;
      padding: 5px 12px;
      border-radius: 6px;
      border: 2px solid #fff;
      box-shadow: 3px 3px 0px var(--secondary);
      letter-spacing: 1px;
    }

    .card {
      background: var(--card-bg);
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      width: 330px;
      border: 3px solid var(--border);
      box-shadow: 6px 6px 0px var(--primary);
    }

    h2 {
      font-family: 'VT323', monospace;
      font-size: 38px;
      letter-spacing: 2px;
      margin: 0 0 20px 0;
      color: var(--secondary);
      text-shadow: 2px 2px var(--primary);
    }

    input {
      width: 85%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: #0f0e17;
      color: white;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 2px solid #fff;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: var(--primary);
      color: white;
      box-shadow: 4px 4px 0px #fff;
    }

    button.grabando {
      background: #ff3333;
      animation: pulseBlink 0.8s infinite alternate;
    }

    #estado {
      margin-top: 20px;
      color: #ffcc00;
      font-family: 'VT323', monospace;
      font-size: 18px;
      word-break: break-word;
    }

    @keyframes pulseBlink {
      0% { opacity: 1; }
      100% { opacity: 0.7; }
    }
  </style>
</head>
<body>

  <!-- Letrero de control de versión -->
  <div id="tagVersion">VERSIÓN 1</div>

<div class="card">
  <h2>🎙️ AUDIO-CAST</h2>
  <input type="text" id="usuario" placeholder="Tu nombre / Tag" maxlength="20">
  <button id="btnGrabar">TOCAR PARA GRABAR</button>
  <p id="estado">LISTO (MÁX 10S)</p>
</div>

<script>
  const SUPABASE_URL = 'https://imgykwbppdxynbaznhlg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_n9sInXCIbT5clU4pNKfHtg_EvF29TCb';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const btnGrabar = document.getElementById('btnGrabar');
  const estado = document.getElementById('estado');
  const inputUsuario = document.getElementById('usuario');

  let mediaRecorder;
  let audioChunks = [];
  let grabando = false;
  let timeoutGrabacion;

  btnGrabar.addEventListener('click', async () => {
    if (!grabando) {
      await iniciarGrabacion();
    } else {
      detenerGrabacion();
    }
  });

  async function iniciarGrabacion() {
    estado.textContent = 'PIDIENDO MICRÓFONO...';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) {
          audioChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = enviarAudio;

      mediaRecorder.start();
      grabando = true;
      btnGrabar.textContent = '⏹️ DETENER Y ENVIAR';
      btnGrabar.classList.add('grabando');
      estado.textContent = '🔴 GRABANDO...';

      timeoutGrabacion = setTimeout(() => {
        if (grabando) detenerGrabacion();
      }, 10000);
    } catch (err) {
      estado.textContent = '⚠️ ERROR MIC: ' + err.message;
    }
  }

  function detenerGrabacion() {
    clearTimeout(timeoutGrabacion);
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
    }
    grabando = false;
    btnGrabar.textContent = '⏳ SUBIENDO...';
    btnGrabar.classList.remove('grabando');
    btnGrabar.disabled = true;
    estado.textContent = 'PROCESANDO AUDIO...';
  }

  async function enviarAudio() {
    try {
      if (audioChunks.length === 0) {
        throw new Error("No se capturó ningún dato de audio.");
      }

      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const nombreArchivo = `audio_${Date.now()}.webm`;
      const nombreUsuario = inputUsuario.value.trim() || 'ANÓNIMO';

      estado.textContent = 'SUBIENDO AL STORAGE...';

      // 1. Subir al Storage de Supabase usando el bucket 'AUDIOS'
      const { data: uploadData, error: uploadError } = await db.storage
        .from('AUDIOS')
        .upload(nombreArchivo, audioBlob, {
          cacheControl: '3600',
          upsert: false
        });

      if (uploadError) {
        throw new Error('Storage: ' + uploadError.message);
      }

      estado.textContent = 'OBTENIENDO URL...';

      // 2. Obtener URL pública
      const { data: urlData } = db.storage
        .from('AUDIOS')
        .getPublicUrl(nombreArchivo);

      if (!urlData || !urlData.publicUrl) {
        throw new Error('No se pudo generar la URL pública');
      }

      estado.textContent = 'GUARDANDO EN DB...';

      // 3. Guardar en la tabla mensajes
      const { error: dbError } = await db
        .from('mensajes')
        .insert([{ usuario: nombreUsuario, audio_url: urlData.publicUrl }]);

      if (dbError) {
        throw new Error('DB: ' + dbError.message);
      }

      estado.textContent = '✨ ¡ENVIADO CON ÉXITO!';
    } catch (err) {
      console.error("Fallo:", err);
      estado.textContent = '⚠️ ' + err.message;
    } finally {
      btnGrabar.disabled = false;
      btnGrabar.textContent = 'TOCAR PARA GRABAR';
    }
  }
</script>
</body>
</html>
