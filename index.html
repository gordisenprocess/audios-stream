  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@500;700&display=swap');

    :root {
      --bg-color: #0f0e17;
      --card-bg: #191825;
      --primary: #ff007f;
      --secondary: #00f0ff;
      --text: #fffffe;
      --border: #7f5af0;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      transition: background 1s ease;
      overflow: hidden;
    }

    /* Fondo animado estilo retro grid */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(30px); }
    }

    .card {
      background: var(--card-bg);
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      width: 340px;
      border: 3px solid var(--border);
      box-shadow: 6px 6px 0px var(--primary);
      position: relative;
    }

    h2 {
      font-family: 'VT323', monospace;
      font-size: 38px;
      letter-spacing: 2px;
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--secondary);
      text-shadow: 2px 2px var(--primary);
    }

    input {
      width: 85%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: #0f0e17;
      color: white;
      font-size: 16px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
    }

    input:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 10px var(--secondary);
    }

    button {
      width: 100%;
      padding: 16px;
      border: 2px solid #fff;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: var(--primary);
      color: white;
      font-family: 'Space Grotesk', sans-serif;
      box-shadow: 4px 4px 0px #fff;
      transition: 0.1s ease;
    }

    button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #fff;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #fff;
    }

    button.grabando {
      background: #ff3333;
      animation: pulseBlink 0.8s infinite alternate;
    }

    #estado {
      margin-top: 20px;
      font-size: 14px;
      color: #b8c1ec;
      word-break: break-all;
      font-family: 'VT323', monospace;
      font-size: 20px;
      letter-spacing: 1px;
    }

    @keyframes pulseBlink {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(0.98); }
    }
  </style>
</head>
<body>

</div>
