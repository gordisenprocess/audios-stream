<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUDIO-CAST // Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@500;700&display=swap');

    :root {
      --bg-color: #0f0e17;
      --card-bg: #191825;
      --primary: #ff007f;
      --secondary: #00f0ff;
      --text: #fffffe;
      --border: #7f5af0;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(30px); }
    }

    .card {
      background: var(--card-bg);
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      width: 330px;
      border: 3px solid var(--border);
      box-shadow: 6px 6px 0px var(--primary);
    }

    h2 {
      font-family: 'VT323', monospace;
      font-size: 38px;
      letter-spacing: 2px;
      margin: 0 0 20px 0;
      color: var(--secondary);
      text-shadow: 2px 2px var(--primary);
    }

    input {
      width: 85%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: #0f0e17;
      color: white;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: var(--secondary);
    }

    button {
      width: 100%;
      padding: 16px;
      border: 2px solid #fff;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: var(--primary);
      color: white;
      box-shadow: 4px 4px 0px #fff;
      transition: 0.1s ease;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #fff;
    }

    button.grabando {
      background: #ff3333;
      animation: pulseBlink 0.8s infinite alternate;
    }

    #estado {
      margin-top: 20px;
      color: #ffcc00;
      font-family: 'VT323', monospace;
      font-size: 20px;
      word-break: break-word;
    }

    @keyframes pulseBlink {
      0% { opacity: 1; }
      100% { opacity: 0.7; }
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🎙️ AUDIO-CAST</h2>
  <input type="text" id="usuario" placeholder="Tu nombre / Tag" maxlength="20">
  <button id="btnGrabar">TOCAR PARA GRABAR</button>
  <p id="estado">LISTO (MÁX 10S)</p>
</div>

<script>
  const SUPABASE_URL = 'https://imgykwbppdxynbaznhlg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_n9sInXCIbT5clU4pNKfHtg_EvF29TCb';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const btnGrabar = document.getElementById('btnGrabar');
  const estado = document.getElementById('estado');
  const inputUsuario = document.getElementById('usuario');

  let mediaRecorder;
  let audioChunks = [];
  let grabando = false;
  let timeoutGrabacion;

  // Cambio dinámico de colores
  const paletas = [
    { primary: '#ff007f', secondary: '#00f0ff', border: '#7f5af0' },
    { primary: '#7928ca', secondary: '#ff0080', border: '#4facfe' },
    { primary: '#f77f00', secondary: '#fcbf49', border: '#d62828' },
    { primary: '#06d6a0', secondary: '#118ab2', border: '#ef476f' }
  ];
  let colorIndex = 0;
  setInterval(() => {
    colorIndex = (colorIndex + 1) % paletas.length;
    const p = paletas[colorIndex];
    document.documentElement.style.setProperty('--primary', p.primary);
    document.documentElement.style.setProperty('--secondary', p.secondary);
    document.documentElement.style.setProperty('--border', p.border);
  }, 4000);

  btnGrabar.addEventListener('click', async () => {
    if (!grabando) {
      await iniciarGrabacion();
    } else {
      detenerGrabacion();
    }
  });

  async function iniciarGrabacion() {
    estado.textContent = 'PIDIENDO MICRÓFONO...';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      
      // Seleccionar el mejor formato compatible
      const tipos = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
      const mimeCompatible = tipos.find(t => MediaRecorder.isTypeSupported(t)) || '';

      mediaRecorder = mimeCompatible ? new MediaRecorder(stream, { mimeType: mimeCompatible }) : new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };
      mediaRecorder.onstop = enviarAudio;

      mediaRecorder.start();
      grabando = true;
      btnGrabar.textContent = '⏹️ DETENER Y ENVIAR';
      btnGrabar.classList.add('grabando');
      estado.textContent = '🔴 GRABANDO... HABLA';

      timeoutGrabacion = setTimeout(() => {
        if (grabando) detenerGrabacion();
      }, 10000);
    } catch (err) {
      estado.textContent = '⚠️ ERROR MIC: ' + err.message;
    }
  }

  function detenerGrabacion() {
    clearTimeout(timeoutGrabacion);
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
    }
    grabando = false;
    btnGrabar.textContent = '⏳ SUBIENDO...';
    btnGrabar.classList.remove('grabando');
    btnGrabar.disabled = true;
    estado.textContent = 'ENVIANDO AL SERVER...';
  }

  async function enviarAudio() {
    try {
      const mimeFinal = mediaRecorder.mimeType || 'audio/webm';
      const audioBlob = new Blob(audioChunks, { type: mimeFinal });
      const ext = mimeFinal.includes('mp4') ? 'm4a' : (mimeFinal.includes('ogg') ? 'ogg' : 'webm');
      const nombreArchivo = `audio_${Date.now()}.${ext}`;
      const nombreUsuario = inputUsuario.value.trim() || 'ANÓNIMO';

      // 1. Subir archivo al Storage
      const { error: uploadError } = await db.storage
        .from('audios')
        .upload(nombreArchivo, audioBlob, { contentType: mimeFinal });

      if (uploadError) throw new Error('Storage: ' + uploadError.message);

      // 2. Obtener URL
      const { data: urlData } = db.storage.from('audios').getPublicUrl(nombreArchivo);

      // 3. Guardar en tabla mensajes
      const { error: dbError } = await db
        .from('mensajes')
        .insert([{ usuario: nombreUsuario, audio_url: urlData.publicUrl }]);

      if (dbError) throw new Error('Tabla DB: ' + dbError.message);

      estado.textContent = '✨ ¡ENVIADO CON ÉXITO!';
    } catch (err) {
      console.error(err);
      estado.textContent = '⚠️ ' + err.message;
    } finally {
      btnGrabar.disabled = false;
      btnGrabar.textContent = 'TOCAR PARA GRABAR';
    }
  }
</script>
</body>
</html>
