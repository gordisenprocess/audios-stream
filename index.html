<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Audio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #0f0e17; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #191825; padding: 30px; border-radius: 15px; text-align: center; width: 320px; border: 2px solid #7f5af0; }
    input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #7f5af0; background: #0f0e17; color: white; font-size: 16px; text-align: center; }
    button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background: #ff007f; color: white; }
    button.grabando { background: #ff3333; }
    #estado { margin-top: 15px; font-size: 14px; color: #ffcc00; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎙️ Enviar Audio</h2>
  <input type="text" id="usuario" placeholder="Tu nombre" maxlength="20">
  <button id="btnGrabar" onclick="manejarClic()">Tocar para Grabar</button>
  <p id="estado">Listo</p>
</div>

<script>
  // --- TUS CREDENCIALES DE SUPABASE ---
  const SUPABASE_URL = 'https://imgykwbppdxynbaznhlg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_n9sInXCIbT5clU4pNKfHtg_EvF29TCb';
  // -----------------------------------

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  let mediaRecorder;
  let audioChunks = [];
  let grabando = false;
  let timeoutGrabacion;

  async function manejarClic() {
    if (!grabando) {
      await iniciarGrabacion();
    } else {
      detenerGrabacion();
    }
  }

  async function iniciarGrabacion() {
    const estado = document.getElementById('estado');
    const btnGrabar = document.getElementById('btnGrabar');

    estado.textContent = 'Pidiendo micrófono...';
    
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = enviarAudio;

      mediaRecorder.start();
      grabando = true;
      btnGrabar.textContent = '🛑 Detener y Enviar';
      btnGrabar.classList.add('grabando');
      estado.textContent = '🔴 Grabando (máx 10s)...';

      timeoutGrabacion = setTimeout(() => {
        if (grabando) detenerGrabacion();
      }, 10000);

    } catch (err) {
      console.error(err);
      estado.textContent = 'Error: No se pudo acceder al mic';
    }
  }

  function detenerGrabacion() {
    clearTimeout(timeoutGrabacion);
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(track => track.stop());
    }
    grabando = false;
    const btnGrabar = document.getElementById('btnGrabar');
    btnGrabar.textContent = '⏳ Subiendo...';
    btnGrabar.classList.remove('grabando');
    btnGrabar.disabled = true;
    document.getElementById('estado').textContent = 'Subiendo a la nube...';
  }

  async function enviarAudio() {
    const estado = document.getElementById('estado');
    const btnGrabar = document.getElementById('btnGrabar');
    const nombreUsuario = document.getElementById('usuario').value.trim() || 'Anónimo';

    try {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const nombreArchivo = `audio_${Date.now()}.webm`;

      // 1. Subir al Storage
      const { error: uploadError } = await db.storage
        .from('audios')
        .upload(nombreArchivo, audioBlob);

      if (uploadError) throw uploadError;

      // 2. Obtener URL pública
      const { data: urlData } = db.storage
        .from('audios')
        .getPublicUrl(nombreArchivo);

      // 3. Guardar registro en la tabla
      const { error: dbError } = await db
        .from('mensajes')
        .insert([{ usuario: nombreUsuario, audio_url: urlData.publicUrl }]);

      if (dbError) throw dbError;

      estado.textContent = '✅ ¡Enviado con éxito!';
    } catch (err) {
      console.error(err);
      estado.textContent = '⚠️ Error al enviar';
    } finally {
      btnGrabar.disabled = false;
      btnGrabar.textContent = 'Tocar para Grabar';
    }
  }
</script>
</body>
</html>
