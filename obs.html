<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Widget OBS Retro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@700&display=swap');

    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #btnActivar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: #ff007f;
      color: white;
      border: 2px solid #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 4px 4px 0px #00f0ff;
      z-index: 999;
    }

    #reproductor {
      display: none;
      background: #191825;
      color: #ffffff;
      padding: 20px 25px;
      border-radius: 16px;
      border: 3px solid #7f5af0;
      width: 350px;
      box-shadow: 6px 6px 0px #ff007f;
      animation: aparecer 0.3s ease-out;
    }

    .cabecera {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 14px;
    }

    .icono-onda {
      background: #ff007f;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 2px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    .info-usuario {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .etiqueta {
      font-family: 'VT323', monospace;
      font-size: 18px;
      letter-spacing: 1px;
      color: #00f0ff;
    }

    #nombreUsuario {
      font-size: 20px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .barra-fondo {
      width: 100%;
      height: 10px;
      background: #0f0e17;
      border: 2px solid #7f5af0;
      border-radius: 6px;
      overflow: hidden;
    }

    #barraProgreso {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff007f, #00f0ff);
      transition: width 0.1s linear;
    }

    @keyframes aparecer {
      0% { transform: translateY(20px) scale(0.9); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <button id="btnActivar">🔊 CLIC AQUÍ PARA ACTIVAR AUDIO</button>

  <div id="reproductor">
    <div class="cabecera">
      <div class="icono-onda">🎙️</div>
      <div class="info-usuario">
        <span class="etiqueta">NOTA DE VOZ DE:</span>
        <span id="nombreUsuario">Usuario</span>
      </div>
    </div>
    <div class="barra-fondo">
      <div id="barraProgreso"></div>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://imgykwbppdxynbaznhlg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_n9sInXCIbT5clU4pNKfHtg_EvF29TCb';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const reproductorDiv = document.getElementById('reproductor');
  const nombreSpan = document.getElementById('nombreUsuario');
  const barraProgreso = document.getElementById('barraProgreso');
  const btnActivar = document.getElementById('btnActivar');

  let colaAudios = [];
  let idsProcesados = new Set();
  let reproduciendo = false;
  let audioHabilitado = false;

  // Desbloquear motor de audio con interacción real
  btnActivar.addEventListener('click', () => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    audioHabilitado = true;
    btnActivar.style.display = 'none';
    revisarMensajesNuevos();
  });

  // Método 1: Escucha en tiempo real
  db.channel('canal-audios')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, payload => {
      agregarACola(payload.new);
    })
    .subscribe();

  // Método 2: Revisión periódica cada 3 segundos (respaldo infalible)
  setInterval(revisarMensajesNuevos, 3000);

  async function revisarMensajesNuevos() {
    if (!audioHabilitado) return;
    const { data, error } = await db
      .from('mensajes')
      .select('*')
      .order('id', { ascending: true });

    if (!error && data) {
      data.forEach(msg => agregarACola(msg));
    }
  }

  function agregarACola(mensaje) {
    if (!mensaje || idsProcesados.has(mensaje.id)) return;
    idsProcesados.add(mensaje.id);
    colaAudios.push(mensaje);
    procesarCola();
  }

  async function procesarCola() {
    if (!audioHabilitado || reproduciendo || colaAudios.length === 0) return;

    reproduciendo = true;
    const mensajeActual = colaAudios.shift();

    nombreSpan.textContent = mensajeActual.usuario || 'ANÓNIMO';
    barraProgreso.style.width = '0%';
    reproductorDiv.style.display = 'block';

    const audio = new Audio(mensajeActual.audio_url);

    audio.ontimeupdate = () => {
      if (audio.duration && !isNaN(audio.duration)) {
        const porcentaje = (audio.currentTime / audio.duration) * 100;
        barraProgreso.style.width = porcentaje + '%';
      }
    };

    audio.onended = () => {
      barraProgreso.style.width = '100%';
      setTimeout(() => limpiarYContinuar(mensajeActual), 400);
    };

    audio.onerror = (e) => {
      console.error("Error cargando el audio:", e);
      limpiarYContinuar(mensajeActual);
    };

    try {
      await audio.play();
    } catch (err) {
      console.error("Bloqueo de reproducción:", err);
      limpiarYContinuar(mensajeActual);
    }
  }

  async function limpiarYContinuar(mensaje) {
    try {
      // Borrar registro de la base de datos para que no vuelva a sonar
      await db.from('mensajes').delete().eq('id', mensaje.id);

      // Intentar borrar el archivo físico si existe la política DELETE en Storage
      const urlParts = mensaje.audio_url.split('/');
      const nombreArchivo = urlParts[urlParts.length - 1];
      if (nombreArchivo) {
        await db.storage.from('audios').remove([nombreArchivo]);
      }
    } catch (err) {
      console.error("Error en limpieza:", err);
    }

    reproductorDiv.style.display = 'none';
    barraProgreso.style.width = '0%';
    reproduciendo = false;
    procesarCola();
  }
</script>
</body>
</html>
