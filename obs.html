<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUDIO-CAST // OBS WIDGET</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@500;700&display=swap');

    :root {
      --bg-color: transparent;
      --primary: #ff007f;
      --secondary: #00f0ff;
      --text: #fffffe;
      --card-bg: rgba(25, 24, 37, 0.9);
      --border: #7f5af0;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      height: 100vh;
      overflow: hidden;
    }

    /* Tarjeta de notificación estilo arcade retro */
    .alerta-card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      border-radius: 16px;
      padding: 18px 25px;
      box-shadow: 5px 5px 0px var(--primary);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 280px;
      max-width: 400px;
      transform: translateY(50px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .alerta-card.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .header-audio {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icono-mic {
      font-size: 24px;
      animation: bounceMic 0.6s infinite alternate;
    }

    .usuario-tag {
      font-family: 'VT323', monospace;
      font-size: 30px;
      color: var(--secondary);
      letter-spacing: 1px;
      text-shadow: 2px 2px var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .barra-progreso-container {
      width: 100%;
      height: 6px;
      background: #0f0e17;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .barra-progreso {
      width: 100%;
      height: 100%;
      background: var(--primary);
      transform-origin: left;
      transform: scaleX(1);
    }

    .barra-progreso.animar {
      transition: transform linear;
    }

    /* Botón de activación inicial para OBS */
    #btnActivarAudio {
      position: fixed;
      top: 20px;
      left: 20px;
      background: var(--primary);
      color: white;
      font-family: 'VT323', monospace;
      font-size: 24px;
      padding: 12px 20px;
      border: 3px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--secondary);
      z-index: 999;
      text-shadow: 2px 2px #000;
    }

    #btnActivarAudio.oculto {
      display: none;
    }

    @keyframes bounceMic {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <!-- Botón obligatorio para destrabar el motor de audio en OBS -->
  <button id="btnActivarAudio">🔊 CLIC AQUÍ PARA ACTIVAR AUDIO EN OBS</button>

  <!-- Widget visual de alerta -->
  <div id="alertaCard" class="alerta-card">
    <div class="header-audio">
      <span class="icono-mic">🎙️</span>
      <span id="lblUsuario" class="usuario-tag">ANÓNIMO</span>
    </div>
    <div class="barra-progreso-container">
      <div id="barraProgreso" class="barra-progreso"></div>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://imgykwbppdxynbaznhlg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_n9sInXCIbT5clU4pNKfHtg_EvF29TCb';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const btnActivar = document.getElementById('btnActivarAudio');
  const alertaCard = document.getElementById('alertaCard');
  const lblUsuario = document.getElementById('lblUsuario');
  const barraProgreso = document.getElementById('barraProgreso');

  let audioContext;
  let audioFila = [];
  let reproduciendo = false;

  // Activar contexto de audio por política de navegadores / OBS
  btnActivar.addEventListener('click', () => {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }
    btnActivar.classList.add('oculto');
    console.log("Audio activado correctamente para OBS");
    iniciarSuscripcion();
  });

  function iniciarSuscripcion() {
    // Escuchar en tiempo real la tabla mensajes
    db.channel('public:mensajes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, payload => {
        const nuevoMensaje = payload.new;
        audioFila.push(nuevoMensaje);
        procesarCola();
      })
      .subscribe();

    // Consulta de respaldo (Polling por si falla el realtime)
    setInterval(verificarPendientes, 4000);
  }

  async function verificarPendientes() {
    if (reproduciendo) return;
    try {
      const { data, error } = await db
        .from('mensajes')
        .select('*')
        .order('id', { ascending: true })
        .limit(1);

      if (data && data.length > 0) {
        const mensaje = data[0];
        // Evitar duplicados si ya está en cola
        if (!audioFila.some(m => m.id === mensaje.id)) {
          audioFila.push(mensaje);
          procesarCola();
        }
      }
    } catch (err) {
      console.error("Error en polling:", err);
    }
  }

  async function procesarCola() {
    if (reproduciendo || audioFila.length === 0 || !audioContext) return;

    reproduciendo = true;
    const mensajeActual = audioFila.shift();

    try {
      // 1. Descargar el archivo de audio con Web Audio API
      const response = await fetch(mensajeActual.audio_url);
      const arrayBuffer = await response.arrayBuffer();
      const decodedBuffer = await audioContext.decodeAudioData(arrayBuffer);

      const duracionSegundos = decodedBuffer.duration || 3;

      // 2. Mostrar la tarjeta con el nombre del usuario
      lblUsuario.textContent = mensajeActual.usuario || 'ANÓNIMO';
      alertaCard.classList.add('visible');

      // Animar barra de progreso basada en la duración exacta del audio
      barraProgreso.style.transition = 'none';
      barraProgreso.style.transform = 'scaleX(1)';
      void barraProgreso.offsetWidth; // Trigger reflow
      barraProgreso.style.transition = `transform ${duracionSegundos}s linear`;
      barraProgreso.style.transform = 'scaleX(0)';

      // 3. Reproducir el audio
      const source = audioContext.createBufferSource();
      source.buffer = decodedBuffer;
      source.connect(audioContext.destination);
      source.start(0);

      // 4. Esperar a que termine de sonar
      await new Promise(resolve => setTimeout(resolve, duracionSegundos * 1000));

      // 5. Ocultar tarjeta
      alertaCard.classList.remove('visible');
      await new Promise(resolve => setTimeout(resolve, 400)); // Esperar transición visual

      // 6. Borrar de la base de datos para limpiar y no repetir
      await db.from('mensajes').delete().eq('id', mensajeActual.id);

    } catch (err) {
      console.error("Error reproduciendo audio:", err);
      // Intentar limpiar el mensaje fallido para no trabar la cola
      await db.from('mensajes').delete().eq('id', mensajeActual.id).catch(() => {});
    } finally {
      reproduciendo = false;
      // Continuar con el siguiente si hay más en la cola
      if (audioFila.length > 0) {
        procesarCola();
      }
    }
  }
</script>
</body>
</html>
