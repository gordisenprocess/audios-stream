<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Widget OBS Diagnóstico</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Caja de estado visible en OBS para saber qué ocurre */
    #estadoObs {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ffcc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #00ffcc;
      z-index: 1000;
    }

    #btnActivar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: #ff007f;
      color: white;
      border: 2px solid #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 4px 4px 0px #00f0ff;
      z-index: 999;
    }

    #reproductor {
      display: none;
      position: absolute;
      bottom: 60px;
      left: 20px;
      background: #191825;
      color: #ffffff;
      padding: 15px 20px;
      border-radius: 12px;
      border: 3px solid #7f5af0;
      width: 320px;
      box-shadow: 4px 4px 0px #ff007f;
    }

    .info {
      font-size: 16px;
      font-weight: bold;
      color: #00f0ff;
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- Texto de estado para ver el error o progreso en OBS -->
  <div id="estadoObs">Estado: Esperando clic de activación</div>

  <button id="btnActivar">🔊 CLIC AQUÍ PARA ACTIVAR AUDIO</button>

  <div id="reproductor">
    <div id="nombreUsuario" class="info">Reproduciendo audio...</div>
    <!-- Usamos un elemento audio nativo visible para garantizar que OBS lo renderice -->
    <audio id="elementoAudio" controls></audio>
  </div>

<script>
  const SUPABASE_URL = 'https://imgykwbppdxynbaznhlg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_n9sInXCIbT5clU4pNKfHtg_EvF29TCb';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const estadoObs = document.getElementById('estadoObs');
  const btnActivar = document.getElementById('btnActivar');
  const reproductorDiv = document.getElementById('reproductor');
  const nombreSpan = document.getElementById('nombreUsuario');
  const elementoAudio = document.getElementById('elementoAudio');

  let colaAudios = [];
  let idsProcesados = new Set();
  let reproduciendo = false;
  let audioHabilitado = false;

  // ⚠️ TRUCO CLAVE EN OBS:
  // Para hacer clic en este botón dentro de OBS, debes hacer CLIC DERECHO en la Fuente de Navegador y seleccionar "INTERACTUAR".
  btnActivar.addEventListener('click', () => {
    audioHabilitado = true;
    btnActivar.style.display = 'none';
    estadoObs.textContent = 'Estado: ¡Audio activado! Escuchando mensajes...';
    revisarMensajesNuevos();
  });

  // Escucha en tiempo real
  db.channel('canal-audios-obs')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, payload => {
      estadoObs.textContent = 'Estado: ¡Nuevo audio recibido!';
      agregarACola(payload.new);
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        estadoObs.textContent = 'Estado: Conectado a Supabase (Esperando...)';
      }
    });

  // Respaldo cada 3 segundos
  setInterval(revisarMensajesNuevos, 3000);

  async function revisarMensajesNuevos() {
    if (!audioHabilitado) return;
    const { data, error } = await db
      .from('mensajes')
      .select('*')
      .order('id', { ascending: true });

    if (error) {
      estadoObs.textContent = 'Error DB: ' + error.message;
      return;
    }

    if (data && data.length > 0) {
      data.forEach(msg => agregarACola(msg));
    }
  }

  function agregarACola(mensaje) {
    if (!mensaje || idsProcesados.has(mensaje.id)) return;
    idsProcesados.add(mensaje.id);
    colaAudios.push(mensaje);
    procesarCola();
  }

  async function procesarCola() {
    if (!audioHabilitado || reproduciendo || colaAudios.length === 0) return;

    reproduciendo = true;
    const mensajeActual = colaAudios.shift();

    nombreSpan.textContent = `🎙️ ${mensajeActual.usuario || 'ANÓNIMO'}`;
    reproductorDiv.style.display = 'block';
    estadoObs.textContent = `Estado: Reproduciendo de ${mensajeActual.usuario}`;

    elementoAudio.src = mensajeActual.audio_url;
    
    elementoAudio.onended = () => {
      setTimeout(() => limpiarYContinuar(mensajeActual), 500);
    };

    elementoAudio.onerror = (e) => {
      estadoObs.textContent = 'Error reproduciendo audio HTML5';
      limpiarYContinuar(mensajeActual);
    };

    try {
      await elementoAudio.play();
    } catch (err) {
      estadoObs.textContent = 'Error play(): ' + err.message;
      limpiarYContinuar(mensajeActual);
    }
  }

  async function limpiarYContinuar(mensaje) {
    try {
      // Borrar de la base de datos
      await db.from('mensajes').delete().eq('id', mensaje.id);

      // Borrar del Storage
      const urlParts = mensaje.audio_url.split('/');
      const nombreArchivo = urlParts[urlParts.length - 1];
      if (nombreArchivo) {
        await db.storage.from('audios').remove([nombreArchivo]);
      }
    } catch (err) {
      console.error(err);
    }

    reproductorDiv.style.display = 'none';
    reproduciendo = false;
    estadoObs.textContent = 'Estado: Escuchando mensajes...';
    procesarCola();
  }
</script>
</body>
</html>
