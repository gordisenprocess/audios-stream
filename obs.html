<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Widget OBS Definitivo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Botón de activación inicial para desbloquear el audio en OBS */
    #btnActivar {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(255, 0, 127, 0.8);
      color: white;
      border: 2px solid #fff;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 999;
    }

    #reproductor {
      display: none;
      background: rgba(18, 18, 22, 0.95);
      color: #ffffff;
      padding: 18px 25px;
      border-radius: 16px;
      border: 2px solid #9146FF;
      width: 340px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(145, 70, 255, 0.4);
    }

    .cabecera {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .icono-onda {
      background: #9146FF;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
    }

    .info-usuario {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .etiqueta {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #b3b3b3;
    }

    #nombreUsuario {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .barra-fondo {
      width: 100%;
      height: 6px;
      background: #2e2e36;
      border-radius: 4px;
      overflow: hidden;
    }

    #barraProgreso {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #9146FF, #00d2ff);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <!-- Botón obligatorio para habilitar el motor de audio -->
  <button id="btnActivar">🔊 CLIC AQUÍ PARA ACTIVAR AUDIO</button>

  <div id="reproductor">
    <div class="cabecera">
      <div class="icono-onda">🎙️</div>
      <div class="info-usuario">
        <span class="etiqueta">Nota de voz de</span>
        <span id="nombreUsuario">Usuario</span>
      </div>
    </div>
    <div class="barra-fondo">
      <div id="barraProgreso"></div>
    </div>
  </div>

<script>
  // --- TUS CREDENCIALES DE SUPABASE ---
  const SUPABASE_URL = 'https://imgykwbppdxynbaznhlg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_n9sInXCIbT5clU4pNKfHtg_EvF29TCb';
  // ------------------------------------

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const reproductorDiv = document.getElementById('reproductor');
  const nombreSpan = document.getElementById('nombreUsuario');
  const barraProgreso = document.getElementById('barraProgreso');
  const btnActivar = document.getElementById('btnActivar');

  let colaAudios = [];
  let reproduciendo = false;
  let audioHabilitado = false;

  // Al hacer clic en el botón de OBS, se desbloquea el motor de audio
  btnActivar.addEventListener('click', () => {
    audioHabilitado = true;
    btnActivar.style.display = 'none'; // Ocultar el botón una vez activado
    console.log("Audio activado correctamente.");
    procesarCola();
  });

  // Escuchar nuevos mensajes en tiempo real
  db.channel('canal-audios')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, payload => {
      console.log("Nuevo audio recibido en OBS:", payload.new);
      colaAudios.push(payload.new);
      procesarCola();
    })
    .subscribe();

  async function procesarCola() {
    // Si el usuario aún no hizo clic en activar el audio en OBS, detenemos aquí
    if (!audioHabilitado || reproduciendo || colaAudios.length === 0) return;

    reproduciendo = true;
    const mensajeActual = colaAudios.shift();

    nombreSpan.textContent = mensajeActual.usuario || 'Anónimo';
    barraProgreso.style.width = '0%';
    reproductorDiv.style.display = 'block';

    const audio = new Audio(mensajeActual.audio_url);

    audio.ontimeupdate = () => {
      if (audio.duration) {
        const porcentaje = (audio.currentTime / audio.duration) * 100;
        barraProgreso.style.width = porcentaje + '%';
      }
    };

    audio.onended = () => {
      barraProgreso.style.width = '100%';
      setTimeout(() => limpiarYContinuar(mensajeActual), 300);
    };

    audio.onerror = (e) => {
      console.error("Error reproduciendo audio:", e);
      limpiarYContinuar(mensajeActual);
    };

    try {
      await audio.play();
    } catch (err) {
      console.error("El navegador bloqueó la reproducción:", err);
      limpiarYContinuar(mensajeActual);
    }
  }

  async function limpiarYContinuar(mensaje) {
    try {
      const urlParts = mensaje.audio_url.split('/');
      const nombreArchivo = urlParts[urlParts.length - 1];

      if (nombreArchivo) {
        await db.storage.from('audios').remove([nombreArchivo]);
      }
      await db.from('mensajes').delete().eq('id', mensaje.id);
    } catch (err) {
      console.error("Error al limpiar:", err);
    }

    reproductorDiv.style.display = 'none';
    barraProgreso.style.width = '0%';
    reproduciendo = false;
    procesarCola();
  }
</script>
</body>
</html>
