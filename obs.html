<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Widget OBS Diagnóstico</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #reproductor {
      display: none;
      background: rgba(18, 18, 22, 0.95);
      color: #ffffff;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #ff3b3b;
      width: 360px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    h3 { margin: 0 0 10px 0; font-size: 16px; color: #ffcc00; }
    p { margin: 5px 0; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>

<div id="reproductor">
  <h3 id="titulo">🔴 Reproduciendo...</h3>
  <p><b>De:</b> <span id="nombreUsuario">-</span></p>
  <p id="estadoError" style="color: #ff6b6b; font-size: 12px;"></p>
  <audio id="audioElemento" controls style="width: 100%; margin-top: 10px;"></audio>
</div>

<script>
  // --- TUS CREDENCIALES DE SUPABASE ---
  const SUPABASE_URL = 'https://imgykwbppdxynbaznhlg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_n9sInXCIbT5clU4pNKfHtg_EvF29TCb';
  // ------------------------------------

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const reproductorDiv = document.getElementById('reproductor');
  const nombreSpan = document.getElementById('nombreUsuario');
  const audioElemento = document.getElementById('audioElemento');
  const estadoError = document.getElementById('estadoError');

  let colaAudios = [];
  let reproduciendo = false;

  // Escuchar Supabase en tiempo real
  db.channel('canal-audios')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, payload => {
      console.log("Nuevo audio:", payload.new);
      colaAudios.push(payload.new);
      procesarCola();
    })
    .subscribe();

  function procesarCola() {
    if (reproduciendo || colaAudios.length === 0) return;

    reproduciendo = true;
    const mensajeActual = colaAudios.shift();

    nombreSpan.textContent = mensajeActual.usuario || 'Anónimo';
    estadoError.textContent = 'Cargando archivo...';
    reproductorDiv.style.display = 'block';

    audioElemento.src = mensajeActual.audio_url;
    
    audioElemento.oncanplaythrough = () => {
      estadoError.textContent = 'Reproduciendo audio...';
      audioElemento.play().catch(err => {
        estadoError.textContent = 'Error al reproducir: ' + err.message;
      });
    };

    audioElemento.onerror = (e) => {
      estadoError.textContent = 'Error cargando URL o códec no soportado.';
    };

    audioElemento.onended = () => {
      setTimeout(() => {
        reproductorDiv.style.display = 'none';
        estadoError.textContent = '';
        reproduciendo = false;
        procesarCola();
      }, 1000);
    };
  }
</script>
</body>
</html>
